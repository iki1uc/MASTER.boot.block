<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ IKI1UC · MASTER‑BOOTBLOCK · RUN21</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0b0d12;
      color: #d6dce6;
      font-family: 'Consolas', 'Segoe UI', monospace;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    .wrap { max-width: 1000px; width: 100%; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #2a2e3a;
    }
    header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #6ec8ff, #ffd866, #ff7b7b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .badge {
      font-size: 13px;
      background: #1a1e26;
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid #2a2e3a;
      color: #8a8f9a;
    }
    header .badge strong { color: #e6e9ef; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #14181f;
      border: 1px solid #22272f;
      border-radius: 12px;
      padding: 18px;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #6a6f7a;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e2229;
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #1a1e26;
      font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .row .label { color: #6a6f7a; }
    .row .value { font-weight: 500; font-variant-numeric: tabular-nums; }

    .mode-indicator {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 1px;
      background: #2a2e3a;
      color: #8a8f9a;
      transition: all 0.3s;
    }
    .mode-stage { background: #1a3a4a; color: #6ec8ff; }
    .mode-air  { background: #3a3a1a; color: #ffd866; }
    .mode-aiv  { background: #3a1a3a; color: #ff7b7b; }

    canvas {
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 12px auto;
      background: #0f131a;
      border: 1px solid #1e2229;
      border-radius: 8px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      background: #1a1e26;
      color: #d6dce6;
      border: 1px solid #2a2e3a;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #2a2e3a; border-color: #4a4e5a; }
    button.primary { border-color: #4a6a8a; color: #6ec8ff; }
    button.primary:hover { background: #1a2a3a; }
    button.running { border-color: #ffd866; color: #ffd866; background: #1a1a0a; }

    .log {
      height: 140px;
      overflow-y: auto;
      background: #0f131a;
      border: 1px solid #1e2229;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.7;
      color: #6a6f7a;
    }
    .log .entry { padding: 1px 0; border-bottom: 1px solid #14181f; }
    .log .time { color: #4a4e5a; }
    .log .msg { color: #b0b8c0; }
    .log .msg.stage { color: #6ec8ff; }
    .log .msg.air { color: #ffd866; }
    .log .msg.aiv { color: #ff7b7b; }
    .log .msg.error { color: #ff6b6b; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f131a; }
    ::-webkit-scrollbar-thumb { background: #2a2e3a; border-radius: 4px; }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot-online { background: #6ec8ff; box-shadow: 0 0 8px #6ec8ff44; }
    .dot-offline { background: #ff6b6b; box-shadow: 0 0 8px #ff6b6b44; }
  </style>
</head>
<body>

<!-- circle.html wird optional geladen – wenn vorhanden, wird es genutzt -->
<iframe id="circleEngine" src="circle.html" style="display:none; width:0; height:0; border:0;"></iframe>

<div class="wrap">

  <header>
    <h1>⚡ MASTER‑BOOTBLOCK · RUN21</h1>
    <div class="badge">
      <span class="status-dot dot-online" id="bootDot"></span>
      <span id="bootStatus">SYSTEM READY</span>
    </div>
  </header>

  <div class="grid">

    <!-- Linke Spalte: Modus + Status -->
    <div>
      <div class="card">
        <h2>🌀 MODUS · ZAHNRAD</h2>
        <div class="row"><span class="label">Zahnrad</span><span class="value" id="zahnradDisplay">0</span></div>
        <div class="row">
          <span class="label">Modus</span>
          <span class="value">
            <span class="mode-indicator" id="modeDisplay">stage</span>
          </span>
        </div>
        <div class="row"><span class="label">Tick</span><span class="value" id="tickDisplay">0</span></div>
        <div class="row"><span class="label">Letzter Wechsel</span><span class="value" id="lastSwitch">–</span></div>
        <div class="btn-row">
          <button id="stepBtn" class="primary">▶ Step</button>
          <button id="loopBtn">▶ Loop</button>
          <button id="stopBtn">⏹ Stop</button>
          <button id="resetBtn" style="border-color:#4a4a4a;">⟲ Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>📊 ENGINE‑STATUS</h2>
        <div class="row"><span class="label">A81</span><span class="value" id="a81Display">81</span></div>
        <div class="row"><span class="label">Pfad‑Index</span><span class="value" id="pathIndexDisplay">2</span></div>
        <div class="row"><span class="label">Achse (Axis)</span><span class="value" id="axisDisplay">–</span></div>
        <div class="row"><span class="label">Potenz</span><span class="value" id="potenzDisplay">–</span></div>
        <div class="row"><span class="label">Δt (ms)</span><span class="value" id="deltaDisplay">–</span></div>
      </div>
    </div>

    <!-- Rechte Spalte: Orbit -->
    <div>
      <div class="card">
        <h2>🌐 ORBIT · 9 ACHSEN</h2>
        <canvas id="orbitCanvas" width="400" height="400"></canvas>
        <div style="font-size:11px; color:#6a6f7a; text-align:center; margin-top:4px;">
          <span id="orbitLegend">● STAGE · circle‑Engine</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Log -->
  <div class="card">
    <h2>📜 BOOT‑LOG</h2>
    <div class="log" id="logBox">
      <div class="entry"><span class="time">[init]</span> <span class="msg">Master‑Bootblock initialisiert.</span></div>
    </div>
  </div>

</div>

<script>
/* ================================================================
   1. PFAD & STATE (aus Rotational Engine)
   ================================================================ */
const PFAD = [3, 9, 81, 243, 81, 9];
const ACHSEN = ["d", "e", "i", "n", "o", "r", "s", "u", "w"];
const POTENZEN = [1, 3, 9, 27, 81, 243, 729];

const state = {
  mode: 'stage',
  pathIndex: 2,
  a81: 81,
  axis: '-',
  potenz: '-',
  delta: 0,
  zahnrad: 0,
  step: 0,
  lastTickTime: performance.now(),
  lastSwitch: '-',
  // zusätzliche Felder für nano/rein/impuls (optional)
  nano: '-',
  rein: '-',
  impuls: '-'
};

/* ================================================================
   2. FUSION‑ENGINE (direkt in index.html) – basierend auf RotationalEngine
   ================================================================ */
const FusionEngine = {
  run() {
    // Pfad-Schritt
    state.pathIndex = (state.pathIndex + 1) % PFAD.length;
    state.a81 = PFAD[state.pathIndex];

    // Potenz
    state.potenz = POTENZEN[state.step % POTENZEN.length];

    // Achse
    state.axis = ACHSEN[state.step % ACHSEN.length];

    // nano / rein / impuls (wie in Rotational Engine)
    state.nano = (state.a81 / 9).toFixed(2);
    state.rein = Math.sqrt(state.a81).toFixed(2);
    state.impuls = state.step % 2 === 0 ? "KUCK" : "KUCK-KUCK";

    // Zeit
    const now = performance.now();
    state.delta = now - state.lastTickTime;
    state.lastTickTime = now;

    // Zahnrad + Step
    state.zahnrad = (state.zahnrad + 1) % 12;
    state.step++;
  }
};

/* ================================================================
   3. circle‑ENGINE LESEN (optional, mit Fehlerbehandlung)
   ================================================================ */
function readCircle() {
  try {
    const iframe = document.getElementById('circleEngine');
    if (!iframe || !iframe.contentWindow) return null;
    const api = iframe.contentWindow.getCircleState;
    if (typeof api !== 'function') return null;
    return api();
  } catch (_) {
    return null;
  }
}

function circleIsAlive() {
  const data = readCircle();
  return data && typeof data.a81 === 'number';
}

/* ================================================================
   4. MODUS‑UMSCHALTER (STAGE / AIR / AIV) per Zahnrad
   ================================================================ */
function checkMode() {
  const z = state.zahnrad;
  let newMode;
  if (z < 4) newMode = 'stage';
  else if (z < 8) newMode = 'air';
  else newMode = 'aiv';

  if (newMode !== state.mode) {
    state.lastSwitch = `${newMode} (Zahnrad ${z})`;
    state.mode = newMode;
  }
}

/* ================================================================
   5. ENGINE‑ROUTING (Master‑Bootblock‑Kern)
   ================================================================ */
function updateEngineState() {
  checkMode();

  if (state.mode === 'stage') {
    // circle.html lesen – wenn verfügbar
    const data = readCircle();
    if (data) {
      Object.assign(state, data);
      // Sicherstellen, dass Zahnrad vom Circle kommt
      if (data.zahnrad !== undefined) state.zahnrad = data.zahnrad;
    } else {
      // Fallback: FusionEngine
      FusionEngine.run();
      log('⚠️ circle nicht erreichbar → Fusion‑Fallback', 'error');
    }
  } else if (state.mode === 'air') {
    FusionEngine.run();
  } else if (state.mode === 'aiv') {
    // Hybrid: Circle liefert A81/Potenz, Fusion liefert Axis/Delta
    const c = readCircle();
    FusionEngine.run();
    if (c) {
      state.a81 = c.a81 ?? state.a81;
      state.potenz = c.potenz ?? state.potenz;
      state.pathIndex = c.pathIndex ?? state.pathIndex;
    }
    // axis, delta bleiben von Fusion
  }
}

/* ================================================================
   6. ORBIT‑RENDER
   ================================================================ */
function drawOrbit() {
  const c = document.getElementById('orbitCanvas');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  const cx = w/2, cy = h/2, r = 150;

  ctx.clearRect(0, 0, w, h);

  const points = ACHSEN.map((_, i) => {
    const angle = (i / ACHSEN.length) * 2 * Math.PI - Math.PI/2;
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });

  // Verbindungslinien
  ctx.strokeStyle = '#2a2e3a';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach((p, i) => {
    const next = points[(i+1) % points.length];
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(next.x, next.y);
  });
  ctx.stroke();

  // Knoten
  points.forEach((p, i) => {
    const active = (ACHSEN[i] === state.axis);
    ctx.beginPath();
    ctx.arc(p.x, p.y, active ? 26 : 18, 0, 2 * Math.PI);
    ctx.fillStyle = active ? '#ffd866' : '#1a1e26';
    ctx.fill();
    ctx.strokeStyle = active ? '#ffd866' : '#2a2e3a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = active ? '#0b0d12' : '#6a6f7a';
    ctx.font = '600 16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ACHSEN[i], p.x, p.y);
  });

  // Legende
  const legend = document.getElementById('orbitLegend');
  const modeColor = state.mode === 'stage' ? '#6ec8ff' :
                    state.mode === 'air' ? '#ffd866' : '#ff7b7b';
  const axisLabel = state.axis !== '-' ? state.axis.toUpperCase() : '—';
  legend.innerHTML = `● <span style="color:${modeColor}">${state.mode.toUpperCase()}</span> · Achse ${axisLabel}`;
}

/* ================================================================
   7. DISPLAY
   ================================================================ */
function updateDisplay() {
  document.getElementById('zahnradDisplay').textContent = state.zahnrad;
  document.getElementById('tickDisplay').textContent = state.step;
  document.getElementById('lastSwitch').textContent = state.lastSwitch;

  const modeEl = document.getElementById('modeDisplay');
  modeEl.textContent = state.mode;
  modeEl.className = 'mode-indicator';
  if (state.mode === 'stage') modeEl.classList.add('mode-stage');
  else if (state.mode === 'air') modeEl.classList.add('mode-air');
  else if (state.mode === 'aiv') modeEl.classList.add('mode-aiv');

  document.getElementById('a81Display').textContent = state.a81;
  document.getElementById('pathIndexDisplay').textContent = state.pathIndex;
  document.getElementById('axisDisplay').textContent = state.axis;
  document.getElementById('potenzDisplay').textContent = state.potenz;
  document.getElementById('deltaDisplay').textContent = state.delta.toFixed(1);

  // Boot‑Dot
  const dot = document.getElementById('bootDot');
  const status = document.getElementById('bootStatus');
  if (circleIsAlive()) {
    dot.className = 'status-dot dot-online';
    status.textContent = 'circle ONLINE';
  } else {
    dot.className = 'status-dot dot-offline';
    status.textContent = 'circle OFFLINE · Fusion‑Fallback';
  }

  drawOrbit();
}

/* ================================================================
   8. LOG
   ================================================================ */
function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const time = new Date().toLocaleTimeString('de-DE');
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${type}">${msg}</span>`;
  box.prepend(entry);
  while (box.children.length > 60) box.lastChild?.remove();
}

/* ================================================================
   9. STEP / LOOP / STOP / RESET
   ================================================================ */
let loopInterval = null;

function step() {
  updateEngineState();
  updateDisplay();
  log(`Step ${state.step} · Modus ${state.mode} · A81=${state.a81}`, state.mode);
}

function toggleLoop() {
  if (loopInterval) {
    clearInterval(loopInterval);
    loopInterval = null;
    document.getElementById('loopBtn').textContent = '▶ Loop';
    log('Loop gestoppt.');
  } else {
    loopInterval = setInterval(step, 500);
    document.getElementById('loopBtn').textContent = '⏹ Loop';
    log('Loop gestartet.');
  }
}

function resetSystem() {
  if (loopInterval) {
    clearInterval(loopInterval);
    loopInterval = null;
    document.getElementById('loopBtn').textContent = '▶ Loop';
  }
  state.pathIndex = 2;
  state.a81 = 81;
  state.axis = '-';
  state.potenz = '-';
  state.delta = 0;
  state.zahnrad = 0;
  state.step = 0;
  state.lastTickTime = performance.now();
  state.mode = 'stage';
  state.lastSwitch = 'Reset';
  state.nano = '-';
  state.rein = '-';
  state.impuls = '-';
  updateDisplay();
  log('⟲ System zurückgesetzt.', 'error');
}

/* ================================================================
   10. EVENT‑BINDING
   ================================================================ */
document.getElementById('stepBtn').addEventListener('click', step);
document.getElementById('loopBtn').addEventListener('click', toggleLoop);
document.getElementById('stopBtn').addEventListener('click', () => {
  if (loopInterval) {
    clearInterval(loopInterval);
    loopInterval = null;
    document.getElementById('loopBtn').textContent = '▶ Loop';
    log('Loop manuell gestoppt.');
  }
});
document.getElementById('resetBtn').addEventListener('click', resetSystem);

/* ================================================================
   11. INIT
   ================================================================ */
// circle-Verfügbarkeit prüfen
setTimeout(() => {
  if (!circleIsAlive()) {
circle INTERNAL · full sync  } else {
    log('✅ circle.html verbunden. API verfügbar.', 'stage');
  }
}, 300);

updateDisplay();
log('Master‑Bootblock aktiv. Zahnrad steuert Modus.', 'air');
</script>

</body>
</html>
