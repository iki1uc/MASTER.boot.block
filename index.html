<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER‑BOOTBLOCK · RUN21 · STAGE / AIR / AIV</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#eef2f5;
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#1c2230;
    padding:24px;
    display:flex;
    justify-content:center;
  }
  .wrap { max-width:960px; width:100%; }

  header { margin-bottom:20px; }
  header h1 { font-size:22px; font-weight:600; }
  header p { color:#5a6478; font-size:13px; margin-top:4px; }

  .card {
    background:#fff;
    border:1px solid #d9dde3;
    border-radius:10px;
    padding:18px;
    margin-bottom:20px;
  }
  .card h2 { font-size:14px; font-weight:600; margin-bottom:10px; }

  .row {
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid #f0f1f4;
    font-size:13px;
  }
  .row:last-child{ border-bottom:none; }
  .label{ color:#5a6478; }
  .value{ font-weight:600; font-variant-numeric:tabular-nums; }

  canvas {
    width:100%;
    max-width:400px;
    display:block;
    margin:12px auto;
    background:#fafbfc;
    border:1px solid #e2e5eb;
    border-radius:8px;
  }

  button {
    background:#1c2230;
    color:#fff;
    border:none;
    border-radius:6px;
    padding:8px 14px;
    font-size:13px;
    cursor:pointer;
    margin:2px 6px 0 0;
  }
  button.secondary { background:#fff; color:#1c2230; border:1px solid #d5d9e0; }

  .log {
    height:160px;
    overflow-y:auto;
    background:#f9fafb;
    border:1px solid #e2e5eb;
    border-radius:8px;
    padding:10px 12px;
    font-family:ui-monospace,"SF Mono",monospace;
    font-size:12px;
    line-height:1.6;
    color:#5a6478;
  }
</style>
</head>

<body>

<!-- circle.html läuft im Hintergrund -->
<iframe id="circleEngine" src="circle.html" style="display:none;"></iframe>

<div class="wrap">

<header>
  <h1>MASTER‑BOOTBLOCK · RUN21</h1>
  <p>STAGE · AIR · AIV — Umschaltbar per Zahnrad.</p>
</header>

<div class="card">
  <h2>Modus</h2>
  <div class="row"><span class="label">Zahnrad</span><span class="value" id="zahnradDisplay">0</span></div>
  <div class="row"><span class="label">Modus</span><span class="value" id="modeDisplay">stage</span></div>
</div>

<div class="card">
  <h2>Engine‑Status</h2>
  <div class="row"><span class="label">A81</span><span class="value" id="a81Display">–</span></div>
  <div class="row"><span class="label">Pfad‑Index</span><span class="value" id="pathIndexDisplay">–</span></div>
  <div class="row"><span class="label">Axis</span><span class="value" id="axisDisplay">–</span></div>
  <div class="row"><span class="label">Potenz</span><span class="value" id="potenzDisplay">–</span></div>
  <div class="row"><span class="label">Δt</span><span class="value" id="deltaDisplay">–</span></div>
</div>

<div class="card">
  <h2>Orbit</h2>
  <canvas id="orbitCanvas" width="400" height="400"></canvas>
  <button id="stepBtn">Step</button>
  <button id="loopBtn" class="secondary">▶ Loop</button>
  <button id="stopBtn" class="secondary">⏹ Stop</button>
</div>

<div class="card">
  <h2>Log</h2>
  <div class="log" id="logBox">Master‑Bootblock geladen.</div>
</div>

</div>

<script>
/* ============================================================
   PFAD & STATE
============================================================ */
const PFAD = [3,9,81,243,81,9];

const state = {
  mode: "stage",
  pathIndex: 2,
  a81: 81,
  axis: "-",
  potenz: "-",
  delta: 0,
  zahnrad: 0,
  step: 0,
  lastTickTime: performance.now()
};

/* ============================================================
   FUSION‑ENGINE (index.html)
============================================================ */
class FusionEngine {
  run() {
    state.pathIndex = (state.pathIndex + 1) % PFAD.length;
    state.a81 = PFAD[state.pathIndex];

    const POTENZEN = [1,3,9,27,81,243,729];
    state.potenz = POTENZEN[state.step % POTENZEN.length];

    const AXIS = ["d","e","i","n","o","r","s","u","w"];
    state.axis = AXIS[state.step % AXIS.length];

    const now = performance.now();
    state.delta = now - state.lastTickTime;
    state.lastTickTime = now;

    state.zahnrad = (state.zahnrad + 1) % 12;
    state.step++;
  }
}

const fusion = new FusionEngine();

/* ============================================================
   circle‑Engine lesen
============================================================ */
function readCircle() {
  const iframe = document.getElementById("circleEngine").contentWindow;
  return iframe.getCircleState();
}

/* ============================================================
   Modus‑Umschalter per Zahnrad
============================================================ */
function checkMode() {
  const z = state.zahnrad;

  if (z < 4) state.mode = "stage";     // circle.html Engine
  else if (z < 8) state.mode = "air";  // index.html Engine
  else state.mode = "aiv";             // Hybrid
}

/* ============================================================
   Engine‑Routing
============================================================ */
function updateEngineState() {
  checkMode();

  if (state.mode === "stage") {
    Object.assign(state, readCircle());
  }

  else if (state.mode === "air") {
    fusion.run();
  }

  else if (state.mode === "aiv") {
    const c = readCircle();
    fusion.run();

    state.a81 = c.a81;
    state.potenz = c.potenz;
    state.axis = state.axis;
    state.delta = state.delta;
  }
}

/* ============================================================
   Orbit‑Render
============================================================ */
function drawOrbit() {
  const c = document.getElementById("orbitCanvas");
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);

  const cx = c.width/2;
  const cy = c.height/2;
  const r = 150;

  const AXIS = ["d","e","i","n","o","r","s","u","w"];

  AXIS.forEach((a,i)=>{
    const angle = (i / AXIS.length) * 2 * Math.PI - Math.PI/2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    const active = (a === state.axis);

    ctx.beginPath();
    ctx.arc(x,y, active ? 26 : 18, 0, 2*Math.PI);
    ctx.fillStyle = active ? "#1c2230" : "#fff";
    ctx.fill();
    ctx.strokeStyle = active ? "#1c2230" : "#c5cad3";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = active ? "#fff" : "#1c2230";
    ctx.font = "600 16px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(a, x, y);
  });
}

/* ============================================================
   Display
============================================================ */
function updateDisplay() {
  document.getElementById("modeDisplay").textContent = state.mode;
  document.getElementById("zahnradDisplay").textContent = state.zahnrad;

  document.getElementById("a81Display").textContent = state.a81;
  document.getElementById("pathIndexDisplay").textContent = state.pathIndex;
  document.getElementById("axisDisplay").textContent = state.axis;
  document.getElementById("potenzDisplay").textContent = state.potenz;
  document.getElementById("deltaDisplay").textContent = state.delta.toFixed(1);

  drawOrbit();
}

function log(msg) {
  const t = new Date().toLocaleTimeString("de-DE");
  const box = document.getElementById("logBox");
  box.innerHTML = `[${t}] ${msg}<br>` + box.innerHTML;
}

/* ============================================================
   LOOP
============================================================ */
let loop = null;

function step() {
  updateEngineState();
  updateDisplay();
  log(`Step ${state.step} → Modus=${state.mode}, Zahnrad=${state.zahnrad}`);
}
 
document.getElementById("stepBtn").onclick = step;

document.getElementById("loopBtn").onclick = ()=>{
  if(loop) return;
  loop = setInterval(step, 500);
  log("Loop gestartet.");
};

document.getElementById("stopBtn").onclick = ()=>{
  if(loop){
    clearInterval(loop);
    loop = null;
    log("Loop gestoppt.");
  }
};

updateDisplay();
log("Master‑Bootblock aktiv.");
</script>

</body>
</html>
