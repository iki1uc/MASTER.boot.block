<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ IKI1UC · RUN21 · CORE</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0e14;
      color: #d0d8e0;
      font-family: 'Consolas', 'Segoe UI', monospace;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: radial-gradient(ellipse at 20% 30%, #0d1a2a, #050608);
    }
    .wrap { max-width: 1100px; width: 100%; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #1a2230;
    }
    header h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #6ec8ff, #ffd866);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header .badge {
      font-size: 13px;
      background: #101820;
      padding: 4px 16px;
      border-radius: 30px;
      border: 1px solid #2a3a4a;
      color: #8a9aaa;
    }
    .badge .dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 1.2s infinite;
    }
    .dot-stage { background: #6ec8ff; box-shadow: 0 0 10px #6ec8ff66; }
    .dot-air   { background: #ffd866; box-shadow: 0 0 10px #ffd86666; }
    .dot-aiv   { background: #ff7b7b; box-shadow: 0 0 10px #ff7b7b66; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1); opacity: 0.7; }
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #0e141c;
      border: 1px solid #1a2230;
      border-radius: 12px;
      padding: 16px;
      transition: border-color 0.3s;
    }
    .card.stage-card { border-top: 3px solid #6ec8ff; }
    .card.air-card   { border-top: 3px solid #ffd866; }
    .card.aiv-card   { border-top: 3px solid #ff7b7b; }
    .card h2 {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1px;
      color: #5a6a7a;
      margin-bottom: 10px;
      border-bottom: 1px solid #16202a;
      padding-bottom: 5px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid #0e1620;
      font-size: 13px;
    }
    .row:last-child { border-bottom: none; }
    .row .label { color: #5a6a7a; }
    .row .value { font-weight: 500; }

    .mode-indicator {
      display: inline-block;
      padding: 2px 14px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      background: #16202a;
      color: #8a9aaa;
    }
    .mode-stage { background: #0a2a3a; color: #6ec8ff; }
    .mode-air   { background: #2a2a0a; color: #ffd866; }
    .mode-aiv   { background: #2a0a1a; color: #ff7b7b; }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      background: #141e28;
      color: #d0d8e0;
      border: 1px solid #2a3a4a;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #1e2a36; border-color: #4a5a6a; }
    button.primary { border-color: #4a7a9a; color: #6ec8ff; }
    button.primary:hover { background: #0a2a3a; }
    button.danger { border-color: #ff6b6b; color: #ff6b6b; }

    canvas {
      width: 100%;
      max-width: 400px;
      display: block;
      margin: 8px auto;
      background: #0a0e14;
      border: 1px solid #16202a;
      border-radius: 10px;
    }

    .log {
      height: 120px;
      overflow-y: auto;
      background: #080c12;
      border: 1px solid #16202a;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 11px;
      line-height: 1.6;
      color: #5a6a7a;
    }
    .log .entry { padding: 1px 0; border-bottom: 1px solid #0e141c; }
    .log .time { color: #2a3a4a; }
    .log .msg { color: #b0b8c0; }
    .log .msg.stage { color: #6ec8ff; }
    .log .msg.air   { color: #ffd866; }
    .log .msg.aiv   { color: #ff7b7b; }
    .log .msg.error { color: #ff6b6b; }

    .pfad-visual {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin: 6px 0;
      font-size: 14px;
      font-weight: 600;
      color: #3a4a5a;
    }
    .pfad-visual .active {
      color: #ffd866;
      text-shadow: 0 0 16px #ffd86644;
    }
    .pfad-visual .sep { color: #1a2230; }

    .energy-bar {
      background: #080c12;
      border-radius: 8px;
      height: 6px;
      margin: 6px 0 4px;
      overflow: hidden;
      border: 1px solid #16202a;
    }
    .energy-bar .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6ec8ff, #ffd866);
      transition: width 0.3s ease;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 14px;
      padding: 8px;
      background: #0e141c;
      border-radius: 10px;
      border: 1px solid #16202a;
      font-size: 12px;
      color: #5a6a7a;
    }
    .footer .stat { display: flex; align-items: center; gap: 4px; }
    .footer .dot-sm {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .footer .dot-sm.stage { background: #6ec8ff; }
    .footer .dot-sm.air   { background: #ffd866; }
    .footer .dot-sm.aiv   { background: #ff7b7b; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #080c12; }
    ::-webkit-scrollbar-thumb { background: #16202a; border-radius: 4px; }
  </style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>⚡ RUN21 · CORE</h1>
    <div class="badge">
      <span class="dot dot-stage" id="bootDot"></span>
      <span id="bootStatus">STAGE</span>
    </div>
  </header>

  <div class="grid">

    <div>
      <div class="card stage-card" id="modeCard">
        <h2>🌀 MODUS · ZAHNRAD</h2>
        <div class="row"><span class="label">Zahnrad</span><span class="value" id="zahnradDisplay">0</span></div>
        <div class="row">
          <span class="label">Modus</span>
          <span class="value"><span class="mode-indicator" id="modeDisplay">stage</span></span>
        </div>
        <div class="row"><span class="label">Tick</span><span class="value" id="tickDisplay">0</span></div>

        <div class="energy-bar"><div class="fill" id="energyFill"></div></div>

        <div class="pfad-visual" id="pfadVisual">
          <span class="active" id="p0">3</span><span class="sep">→</span>
          <span id="p1">9</span><span class="sep">→</span>
          <span id="p2">81</span><span class="sep">→</span>
          <span id="p3">243</span><span class="sep">→</span>
          <span id="p4">81</span><span class="sep">→</span>
          <span id="p5">9</span>
        </div>

        <div class="btn-row">
          <button id="stepBtn" class="primary">▶ Step</button>
          <button id="loopBtn">▶ Loop</button>
          <button id="stopBtn">⏹ Stop</button>
          <button id="resetBtn" class="danger">⟲ Reset</button>
        </div>
      </div>

      <div class="card">
        <h2>📊 ENGINE</h2>
        <div class="row"><span class="label">A81</span><span class="value" id="a81Display">81</span></div>
        <div class="row"><span class="label">Achse</span><span class="value" id="axisDisplay">–</span></div>
        <div class="row"><span class="label">Potenz</span><span class="value" id="potenzDisplay">–</span></div>
        <div class="row"><span class="label">Δt</span><span class="value" id="deltaDisplay">–</span></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>🌐 ORBIT</h2>
        <canvas id="orbitCanvas" width="400" height="400"></canvas>
        <div style="font-size:11px; color:#5a6a7a; text-align:center; margin-top:4px;">
          <span id="orbitLegend">● STAGE · Achse —</span>
        </div>
      </div>
    </div>

  </div>

  <div class="card">
    <h2>📜 LOG</h2>
    <div class="log" id="logBox">
      <div class="entry"><span class="time">[init]</span> <span class="msg">RUN21 CORE gestartet.</span></div>
    </div>
  </div>

  <div class="footer">
    <div class="stat"><span class="dot-sm stage"></span> STAGE</div>
    <div class="stat"><span class="dot-sm air"></span> AIR</div>
    <div class="stat"><span class="dot-sm aiv"></span> AIV</div>
    <div class="stat">⚡ <span id="footerEnergy">0%</span></div>
  </div>

</div>

<script>
// ================================================================
// 1. PFAD & STATE (nur das Nötigste)
// ================================================================
const PFAD = [3, 9, 81, 243, 81, 9];
const ACHSEN = ["d", "e", "i", "n", "o", "r", "s", "u", "w"];
const POTENZEN = [1, 3, 9, 27, 81, 243, 729];

const state = {
  mode: 'stage',
  pathIndex: 2,
  a81: 81,
  axis: '-',
  potenz: '-',
  delta: 0,
  zahnrad: 0,
  step: 0,
  lastTickTime: performance.now(),
  energy: 0
};

// ================================================================
// 2. CIRCLE ENGINE (kreisbasiert)
// ================================================================
const Circle = {
  _idx: 2,
  tick() {
    const angle = state.zahnrad * 30;
    this._idx = Math.floor((angle / 360) * PFAD.length) % PFAD.length;
    return {
      a81: PFAD[this._idx],
      axis: ACHSEN[state.zahnrad % ACHSEN.length],
      potenz: POTENZEN[this._idx % POTENZEN.length],
      pathIndex: this._idx
    };
  }
};

// ================================================================
// 3. FUSION ENGINE (linear)
// ================================================================
function fusionTick() {
  state.pathIndex = (state.pathIndex + 1) % PFAD.length;
  state.a81 = PFAD[state.pathIndex];
  state.potenz = POTENZEN[state.step % POTENZEN.length];
  state.axis = ACHSEN[state.step % ACHSEN.length];
  state.zahnrad = (state.zahnrad + 1) % 12;
}

// ================================================================
// 4. MODUS (nur 3 – STAGE, AIR, AIV)
// ================================================================
function checkMode() {
  const z = state.zahnrad;
  const newMode = z < 4 ? 'stage' : (z < 8 ? 'air' : 'aiv');
  if (newMode !== state.mode) {
    state.mode = newMode;
    log(`🔄 Moduswechsel → ${newMode.toUpperCase()} (Zahnrad ${z})`, newMode);
  }
}

// ================================================================
// 5. ENGINE-ROUTING (klar & kurz)
// ================================================================
function stepEngine() {
  checkMode();

  if (state.mode === 'stage') {
    const c = Circle.tick();
    Object.assign(state, c);
  } else if (state.mode === 'air') {
    fusionTick();
  } else { // aiv
    const c = Circle.tick();
    fusionTick();
    state.a81 = c.a81;
    state.potenz = c.potenz;
    state.pathIndex = c.pathIndex;
  }

  state.energy = Math.min(100, state.energy + 2 - 0.3);
  const now = performance.now();
  state.delta = now - state.lastTickTime;
  state.lastTickTime = now;
  state.step++;
}

// ================================================================
// 6. ORBIT
// ================================================================
function drawOrbit() {
  const c = document.getElementById('orbitCanvas');
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  const cx = w/2, cy = h/2, r = 150;

  ctx.clearRect(0, 0, w, h);

  const points = ACHSEN.map((_, i) => {
    const angle = (i / ACHSEN.length) * 2 * Math.PI - Math.PI/2;
    return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
  });

  ctx.strokeStyle = '#1a2230';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  points.forEach((p, i) => {
    const next = points[(i+1) % points.length];
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(next.x, next.y);
  });
  ctx.stroke();

  points.forEach((p, i) => {
    const active = (ACHSEN[i] === state.axis);
    ctx.beginPath();
    ctx.arc(p.x, p.y, active ? 26 : 16, 0, 2 * Math.PI);
    ctx.fillStyle = active ? '#ffd866' : '#0e141c';
    ctx.fill();
    ctx.strokeStyle = active ? '#ffd866' : '#2a3a4a';
    ctx.lineWidth = active ? 2 : 1;
    ctx.stroke();
    ctx.fillStyle = active ? '#0a0e14' : '#5a6a7a';
    ctx.font = '600 15px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ACHSEN[i], p.x, p.y);
  });

  const modeColor = state.mode === 'stage' ? '#6ec8ff' :
                    state.mode === 'air' ? '#ffd866' : '#ff7b7b';
  const label = state.mode === 'air' ? 'Fusion' :
                state.mode === 'aiv' ? 'Hybrid' : 'Circle';
  document.getElementById('orbitLegend').innerHTML =
    `● <span style="color:${modeColor}">${state.mode.toUpperCase()}</span> · ${label} · Achse ${state.axis !== '-' ? state.axis.toUpperCase() : '—'}`;
}

// ================================================================
// 7. DISPLAY
// ================================================================
function updateDisplay() {
  document.getElementById('zahnradDisplay').textContent = state.zahnrad;
  document.getElementById('tickDisplay').textContent = state.step;
  document.getElementById('a81Display').textContent = state.a81;
  document.getElementById('axisDisplay').textContent = state.axis;
  document.getElementById('potenzDisplay').textContent = state.potenz;
  document.getElementById('deltaDisplay').textContent = state.delta.toFixed(1);

  document.getElementById('energyFill').style.width = Math.round(state.energy) + '%';
  document.getElementById('footerEnergy').textContent = Math.round(state.energy) + '%';

  const modeEl = document.getElementById('modeDisplay');
  modeEl.textContent = state.mode;
  modeEl.className = 'mode-indicator mode-' + state.mode;

  const dot = document.getElementById('bootDot');
  dot.className = 'dot dot-' + state.mode;
  document.getElementById('bootStatus').textContent = state.mode.toUpperCase();

  const card = document.getElementById('modeCard');
  card.className = 'card ' + state.mode + '-card';

  const idx = state.pathIndex;
  for (let i = 0; i < PFAD.length; i++) {
    const el = document.getElementById('p' + i);
    if (el) {
      el.className = (i === idx) ? 'active' : '';
      el.textContent = PFAD[i];
    }
  }

  drawOrbit();
}

// ================================================================
// 8. LOG
// ================================================================
function log(msg, type = '') {
  const box = document.getElementById('logBox');
  const time = new Date().toLocaleTimeString('de-DE');
  const entry = document.createElement('div');
  entry.className = 'entry';
  entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${type}">${msg}</span>`;
  box.prepend(entry);
  while (box.children.length > 40) box.lastChild?.remove();
}

// ================================================================
// 9. STEP / LOOP / RESET
// ================================================================
let loop = null;

function step() {
  stepEngine();
  updateDisplay();
  log(`Step ${state.step} · ${state.mode.toUpperCase()} · A81=${state.a81} · Achse=${state.axis}`, state.mode);
}

function toggleLoop() {
  if (loop) {
    clearInterval(loop);
    loop = null;
    document.getElementById('loopBtn').textContent = '▶ Loop';
    log('Loop gestoppt.');
  } else {
    loop = setInterval(step, 500);
    document.getElementById('loopBtn').textContent = '⏹ Loop';
    log('Loop gestartet.');
  }
}

function resetSystem() {
  if (loop) { clearInterval(loop); loop = null; document.getElementById('loopBtn').textContent = '▶ Loop'; }
  state.pathIndex = 2;
  state.a81 = 81;
  state.axis = '-';
  state.potenz = '-';
  state.delta = 0;
  state.zahnrad = 0;
  state.step = 0;
  state.lastTickTime = performance.now();
  state.mode = 'stage';
  state.energy = 0;
  updateDisplay();
  log('⟲ Reset.', 'error');
}

// ================================================================
// 10. EVENTS & INIT
// ================================================================
document.getElementById('stepBtn').addEventListener('click', step);
document.getElementById('loopBtn').addEventListener('click', toggleLoop);
document.getElementById('stopBtn').addEventListener('click', () => {
  if (loop) { clearInterval(loop); loop = null; document.getElementById('loopBtn').textContent = '▶ Loop'; log('Loop manuell gestoppt.'); }
});
document.getElementById('resetBtn').addEventListener('click', resetSystem);

updateDisplay();
log('✅ RUN21 CORE aktiv · Zahnrad 0-3 STAGE, 4-7 AIR, 8-11 AIV.', 'stage');
</script>

</body>
</html>
